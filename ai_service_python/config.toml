# Server-owned AI settings. Restart the Python service after changing these.
# Optional config.local.toml overrides this file; keep secrets in local settings
# or AOE2_LLM_TOKEN / AOE2_AI_TOKEN environment variables.
[service]
host = "127.0.0.1"
port = 8765
log_observation = false

[llm]
backend = "openai"
model = "qwen3:8b"
base_url = "http://127.0.0.1:11434/v1"
max_tokens = 2048
temperature = 0.2
timeout_sec = 45
num_ctx = 16384
think = false

[ai]
runtime = "cabinet"
legislation_enabled = true
legislation_dir = "legislation_data"
worker_mode = "docker"
worker_image = "localhost:5000/cabinet-worker@sha256:04473314770fda64ce76eaa452107f8eb470faaed354f94ef1fb3dfd4917c59d"
worker_timeout_sec = 5
legislation_max_tokens = 8192
legislation_context_tokens = 32768
legislation_timeout_sec = 180
legislation_max_steps = 24