# Install as /etc/nginx/conf.d/default.conf inside the official nginx image.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Negotiate precompressed siblings while keeping the original URL and MIME.
    # Keep raw files for clients that do not accept gzip.
    gzip off;
    gzip_static on;
    gzip_vary on;
    gzip_proxied any;

    # Godot exports use stable names, so cached files must be revalidated.
    etag on;
    add_header Cache-Control "public, max-age=0, must-revalidate" always;

    location ~ \.wasm$ {
        types { application/wasm wasm; }
        try_files $uri =404;
    }

    location ~ \.pck$ {
        types { application/octet-stream pck; }
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
