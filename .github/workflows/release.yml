name: Game Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: game-release-${{ github.ref }}
  cancel-in-progress: false

env:
  GODOT_VERSION: '4.7.1'

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Install Godot and matching export templates
        run: |
          $release = "$env:GODOT_VERSION-stable"
          $base = "https://github.com/godotengine/godot-builds/releases/download/$release"
          $editorArchive = "$env:RUNNER_TEMP/godot.zip"
          $templatesArchive = "$env:RUNNER_TEMP/templates.zip"
          Invoke-WebRequest "$base/Godot_v${release}_win64.exe.zip" -OutFile $editorArchive
          Invoke-WebRequest "$base/Godot_v${release}_export_templates.tpz" -OutFile $templatesArchive
          Expand-Archive $editorArchive "$env:RUNNER_TEMP/godot"
          Expand-Archive $templatesArchive "$env:RUNNER_TEMP/godot-templates"
          $templateDir = "$env:APPDATA/Godot/export_templates/$env:GODOT_VERSION.stable"
          New-Item -ItemType Directory -Force $templateDir | Out-Null
          Copy-Item "$env:RUNNER_TEMP/godot-templates/templates/*" $templateDir -Recurse
          "GODOT=$env:RUNNER_TEMP/godot/Godot_v${release}_win64_console.exe" >> $env:GITHUB_ENV

      - name: Import project
        run: |
          & $env:GODOT --headless --path . --editor --import
          if ($LASTEXITCODE -ne 0) { throw "Godot import failed: $LASTEXITCODE" }

      - name: Export Windows x64
        run: |
          New-Item -ItemType Directory -Force dist/windows | Out-Null
          & $env:GODOT --headless --path . --export-release "Windows Desktop" dist/windows/aoe2.exe
          if ($LASTEXITCODE -ne 0) { throw "Godot export failed: $LASTEXITCODE" }
          foreach ($file in @('aoe2.exe', 'aoe2.pck')) {
            if (!(Test-Path "dist/windows/$file") -or (Get-Item "dist/windows/$file").Length -eq 0) {
              throw "Missing or empty export: $file"
            }
          }

      - name: Package game and checksum
        run: |
          $version = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME } else { "build-$($env:GITHUB_SHA.Substring(0, 7))" }
          $archive = "aoe2-$version-windows-x64.zip"
          Copy-Item deploy/windows/README.txt dist/windows/README.txt
          Compress-Archive -Path dist/windows/* -DestinationPath "dist/$archive"
          $hash = (Get-FileHash "dist/$archive" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $archive" | Set-Content dist/SHA256SUMS.txt -Encoding ascii

      - uses: actions/upload-artifact@v4
        with:
          name: aoe2-windows-x64
          path: |
            dist/*.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: aoe2-windows-x64
          path: dist
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" dist/*.zip dist/SHA256SUMS.txt \
            --verify-tag --title "AoE2 RTS $RELEASE_TAG" --generate-notes
