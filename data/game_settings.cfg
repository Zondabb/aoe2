; Global game settings (edit and restart / re-enter match to apply).
; Optional override: copy to user://game_settings.cfg (wins over res://).
; speed: Engine.time_scale multiplier. 1.0 = normal, 2.0 = double, 0.5 = half.

[game]
speed=2.0

; Multiplayer server IP/domain and published TCP port (restart game to apply).
; Desktop override: game_settings.cfg beside the executable, then user://game_settings.cfg.
[multiplayer]
host="127.0.0.1"
port=8001
; Use true only behind a TLS-enabled WebSocket proxy (normally port=443).
use_tls=false

; AI HTTP / LLM-compat settings.
; api_token: leave empty in packaged defaults. Prefer user:// override or AOE2_AI_TOKEN.
; protocol: v1_tick | v2_chat | v3_multi_agent (fast ticks + background planning)
; Env overrides: AOE2_AI_URL → service_url, AOE2_AI_TOKEN → api_token

[ai]
; Godot ConfigFile: quote every string (URLs and protocol).
; Unquoted text like http://... or v2_chat makes the whole file fail to load.
service_url="http://127.0.0.1:8765"
chat_url=""
api_token=""
; api_token authenticates to the Python AI service, not to its model provider.
; Model/provider/generation settings belong to ai_service_python/config.toml.
; Legacy synchronous v1/v2 HTTP timeout. v3 uses fast_timeout_sec below.
timeout_sec=120
; Legacy v1/v2 tick interval in simulation seconds. v3 uses fast_tick_interval_sec.
tick_interval_sec=10
protocol="v2_chat"
; External LLM uses fast v3 observations and background specialist planning.
; Set false to restore the legacy synchronous chat path.
multi_agent_enabled=true
fast_tick_interval_sec=1.0
fast_timeout_sec=3.0
use_local_embedded=false
