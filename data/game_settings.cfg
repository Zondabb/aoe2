; Global game settings (edit and restart / re-enter match to apply).
; Optional override: copy to user://game_settings.cfg (wins over res://).
; speed: Engine.time_scale multiplier. 1.0 = normal, 2.0 = double, 0.5 = half.

[game]
speed=2.0

; Multiplayer server IP/domain and published TCP port (restart game to apply).
; Desktop override: game_settings.cfg beside the executable, then user://game_settings.cfg.
[multiplayer]
host="127.0.0.1"
port=8001
; Use true only behind a TLS-enabled WebSocket proxy (normally port=443).
use_tls=false

; AI HTTP / LLM-compat settings.
; api_token: leave empty in packaged defaults. Prefer user:// override or AOE2_AI_TOKEN.
; protocol: v1_tick (current tick/tick_batch) | v2_chat (chat completions, P1+)
; Env overrides: AOE2_AI_URL → service_url, AOE2_AI_TOKEN → api_token

[ai]
; Godot ConfigFile: quote every string (URLs, protocol, backend, model).
; Unquoted text like http://... or v2_chat makes the whole file fail to load.
service_url="http://127.0.0.1:8765"
chat_url=""
api_token=""
backend="openai"
; Kuailu-LLM 手册：当前开放模型为 deepseek-v4-flash-0731（其他模型名会 503）
model="deepseek-v4-flash-0731"
; LLM batch (2 teams) often 30–60s+; must exceed worst-case API latency or Gateway skips the tick
timeout_sec=120
; Seconds between AI ticks after the prior HTTP call finishes (LLM path: keep >= API latency)
tick_interval_sec=10
protocol="v2_chat"
use_local_embedded=false
max_tokens=2048
; history_turns: recent assistant summaries per team (0 = off)
history_turns=0
; log_observation: server prints messages length / entity count
log_observation=false
; llm_base_url: OpenAI-compatible base when backend=openai（Kuailu 用 /v1，不要带 /chat/completions）
llm_base_url="https://test-newapi.kuailutech.cn/v1"
